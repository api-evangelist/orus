name: Orus
description: 'Orus is a French online insurance broker ("l''assurance professionnelle en ligne")
  offering professional-liability and business insurance to independent professionals and small
  businesses across France. Products include RC Pro (professional liability), Multirisque
  Professionnelle, Assurance Décennale (ten-year construction liability), Assurance Bureau (office
  insurance), Mutuelle Santé TNS (self-employed health), and Prévoyance TNS (income protection),
  serving sectors from consultants and construction to hospitality, retail, and wellness. Backed by
  Partech and Speedinvest, Orus operates a self-service quote-and-buy app (app.orus.eu) but publishes
  no public developer API, SDK, or integration surface at this time. This profile was added to the API
  Evangelist network as a portfolio lead and enriched via public web and domain probes.'
